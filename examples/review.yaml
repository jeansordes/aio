version: 2
name: implementation-and-validation
initial: implement
nodes:
  implement:
    type: action
    name: Implementation
    prompt: Implement TASK.md. Address any corrections from the validation node.
    modelProfile: mid
    next: validate
  validate:
    type: route
    name: Independent validation
    prompt: Inspect the current project and test results independently. Give specific corrections for unmet criteria. Ask the user for essential missing information.
    modelProfile: low
    criteria:
      - The behavior described in TASK.md is implemented and relevant tests pass.
    routes:
      - to: implement
        description: At least one criterion needs corrections.
      - to: complete
        description: All criteria are satisfied with evidence.
  complete:
    type: end
