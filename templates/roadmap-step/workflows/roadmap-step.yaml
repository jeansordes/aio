name: roadmap-step
initial: pickRow
states:
  pickRow:
    role: pick-row
    next:
      - if: step.status == "ok"
        then: implement
      - then: done
  implement:
    role: implement
    next: test
  test:
    role: test
    next:
      - if: step.exit_code == 0
        then: commit
      - then: fix
  fix:
    role: fix
    next: test
  commit:
    role: commit
    next: done
  done:
    type: final
