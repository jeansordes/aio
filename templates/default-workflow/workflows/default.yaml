name: default
initial: analyse
states:
  analyse:
    role: analyse
    next: plan
  plan:
    role: plan
    summary:
      enabled: true
    next: build
  build:
    role: build
    next: review
  review:
    role: review
    next:
      - if: step.status == "not_configured"
        then: log
      - if: step.has_changes == true
        then: fix
      - if: step.exit_code == 0
        then: commit
      - then: log
  fix:
    role: fix
    next: review
  log:
    role: log
    next: done
  commit:
    role: commit
    next: publish
  publish:
    role: publish
    next: done
  done:
    type: final
