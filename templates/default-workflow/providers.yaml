version: 1
providers:
  cursor:
    command: cursor-agent
    args:
      - "-p"
      - "--force"
      - "--trust"
      - "--output-format"
      - "stream-json"
      - "--stream-partial-output"
      - "{{isolation_args}}"
      - "{{model_args}}"
      - "{{prompt}}"
    isolationArgs:
      - "--workspace"
      - "{{project_root}}"
      - "--sandbox"
      - "enabled"
    modelArgs:
      - "--model"
      - "{{model}}"
    prompt:
      include:
        - instructions
        - tracking_file
        - context_files
    success:
      exit_codes: [0]

  codex:
    status: not_configured
    message: "Provider codex is not configured. Edit .aio/providers.yaml."
    # isolationArgs:  # uncomment and add flags your CLI supports to confine scope
    #   - "--example-workspace"
    #   - "{{project_root}}"

