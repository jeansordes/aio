name: Changelog

on:
  push:

permissions:
  contents: write

jobs:
  update:
    if: >
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch &&
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore(changelog):')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Regenerate changelog
        run: npm run changelog:write

      - name: Detect changelog changes
        id: diff
        shell: bash
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changelog
        if: steps.diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(changelog): regenerate from conventional commits"
          git push
